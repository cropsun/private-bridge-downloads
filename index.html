</style></head><body><main class="card"><div class="top"><label><span class="sr-only">Language</span><select id="language" aria-label="Language"><option value="zh">简体中文</option><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="ja">日本語</option></select></label></div><h1 data-k="download.title"></h1><p data-k="download.subtitle"></p><p class="version" data-k="download.version"></p><div class="downloads"><a class="button" href="https://github.com/cropsun/private-bridge-downloads/releases/download/v1.0.0/Private-Remote-Codex-Installer.dmg" data-k="download.dmg"></a><a class="button secondary" href="https://github.com/cropsun/private-bridge-downloads/releases/download/v1.0.0/Private-Remote-Codex-Installer.pkg" data-k="download.pkg"></a></div><h2 data-k="download.sha256"></h2><div class="checksum">DMG · db77367f82f61262c570fb53a4d470e34cf248c4f3ea4be4b099ef7979e6b472</div><div class="checksum" style="margin-top:8px">PKG · a9e9535696191d25333ed43163716616663996b55be280d27c32c755127f438b</div><h2 data-k="download.scope"></h2><p data-k="download.scopeText"></p><div class="warning"><strong data-k="download.unsigned"></strong><br><span data-k="download.requirement"></span></div><ol><li data-k="download.step1"></li><li data-k="download.step2"></li><li data-k="download.step3"></li></ol></main><script>const T={"zh":{"download.title":"Private Bridge for Mac","download.subtitle":"只安装消息同步桥接客户端，不包含 Strimo Chat 或 Codex。","download.dmg":"下载 DMG","download.pkg":"下载 PKG","download.version":"版本 1.0.0 · 通用版（Apple 芯片与 Intel）","download.sha256":"SHA-256 校验值","download.scope":"安装内容与要求","download.scopeText":"此安装包只包含 Private Bridge 客户端和运行时。目标 Mac 需要已安装并登录 Codex；手机端无需安装此包。首次连接仍需在 Strimo Chat 中创建邀请并批准设备。","download.requirement":"macOS 安装包尚未使用 Developer ID 签名与公证。首次打开时，macOS 可能显示安全提示。","download.unsigned":"未签名安装包","download.step1":"在目标 Mac 下载并打开 DMG，或直接打开 PKG 安装。","download.step2":"启动 Private，按页面提示完成配对。","download.step3":"回到 Strimo Chat 的“账号与权限 → 远程设备”批准并绑定。"},"zh-Hant":{"download.title":"Private Bridge for Mac","download.subtitle":"只安裝訊息同步橋接用戶端，不包含 Strimo Chat 或 Codex。","download.dmg":"下載 DMG","download.pkg":"下載 PKG","download.version":"版本 1.0.0 · 通用版（Apple 晶片與 Intel）","download.sha256":"SHA-256 校驗值","download.scope":"安裝內容與需求","download.scopeText":"此安裝包只包含 Private Bridge 用戶端與執行環境。目標 Mac 需要已安裝並登入 Codex；手機端無需安裝此包。首次連線仍需在 Strimo Chat 中建立邀請並批准裝置。","download.requirement":"此 macOS 安裝包尚未使用 Developer ID 簽署與公證。首次開啟時，macOS 可能顯示安全提示。","download.unsigned":"未簽署安裝包","download.step1":"在目標 Mac 下載並開啟 DMG，或直接開啟 PKG 安裝。","download.step2":"啟動 Private，依頁面提示完成配對。","download.step3":"回到 Strimo Chat 的「帳號與權限 → 遠端裝置」批准並綁定。"},"en":{"download.title":"Private Bridge for Mac","download.subtitle":"Installs only the message-sync bridge. Strimo Chat and Codex are not included.","download.dmg":"Download DMG","download.pkg":"Download PKG","download.version":"Version 1.0.0 · Universal (Apple silicon and Intel)","download.sha256":"SHA-256 checksum","download.scope":"What this installs and requires","download.scopeText":"The package contains only the Private Bridge client and runtime. Codex must already be installed and signed in on the target Mac. No install is needed on phones. Create an invitation in Strimo Chat and approve the device to finish pairing.","download.requirement":"This macOS installer is not signed or notarized with a Developer ID. macOS may show a security warning the first time it opens.","download.unsigned":"Unsigned installer","download.step1":"On the target Mac, download and open the DMG, or open the PKG to install.","download.step2":"Launch Private and follow its pairing instructions.","download.step3":"In Strimo Chat, open “Account & Permissions → Remote Devices” and approve and bind the device."},"ja":{"download.title":"Private Bridge for Mac","download.subtitle":"メッセージ同期ブリッジのみをインストールします。Strimo Chat と Codex は含まれません。","download.dmg":"DMG をダウンロード","download.pkg":"PKG をダウンロード","download.version":"バージョン 1.0.0 · Universal（Apple シリコンと Intel）","download.sha256":"SHA-256 チェックサム","download.scope":"インストール内容と要件","download.scopeText":"このパッケージには Private Bridge クライアントとランタイムのみが含まれます。対象 Mac には Codex がインストールされ、サインイン済みである必要があります。スマートフォンへのインストールは不要です。Strimo Chat で招待を作成し、端末を承認してペアリングを完了してください。","download.requirement":"この macOS インストーラーは Developer ID による署名と公証を受けていません。初回起動時に macOS の警告が表示される場合があります。","download.unsigned":"未署名インストーラー","download.step1":"対象 Mac で DMG をダウンロードして開くか、PKG を開いてインストールします。","download.step2":"Private を起動し、画面の案内に従ってペアリングします。","download.step3":"Strimo Chat の「アカウントと権限 → リモート端末」で承認して紐付けます。"}};const selector=document.getElementById('language');function applyLanguage(lang){const d=T[lang]||T.zh;document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.querySelectorAll('[data-k]').forEach(e=>e.textContent=d[e.dataset.k]||'');localStorage.setItem('private-download-locale',lang)}const saved=localStorage.getItem('private-download-locale');const browser=(navigator.language||'zh').toLowerCase();selector.value=saved||(browser.startsWith('ja')?'ja':browser.startsWith('en')?'en':browser.includes('hant')||browser.includes('tw')?'zh-Hant':'zh');selector.addEventListener('change',()=>applyLanguage(selector.value));applyLanguage(selector.value);</script></body></html>
